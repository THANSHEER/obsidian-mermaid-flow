name: Attach release assets

# When a release is published manually (e.g. created in the GitHub UI with your
# own notes), build the plugin and attach the three distributable files to it.
# Auto-releases created by the Release workflow use GITHUB_TOKEN, which by design
# does not re-trigger this workflow, so there is no double build.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact code the release tag points at.
          ref: ${{ github.event.release.tag_name }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package release zip & compute SHA-256
        id: zip
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          ZIP_NAME="obsidian-mermaid-flow-${VERSION}.zip"
          FILES_TO_PACK="main.js manifest.json"
          if [ -f "styles.css" ]; then
            FILES_TO_PACK="$FILES_TO_PACK styles.css"
          fi
          zip -j "$ZIP_NAME" $FILES_TO_PACK
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Generated checksum:"; cat "${ZIP_NAME}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            ${{ steps.zip.outputs.zip_name }}

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            main.js manifest.json styles.css "$ZIP_NAME" "${ZIP_NAME}.sha256" --clobber
