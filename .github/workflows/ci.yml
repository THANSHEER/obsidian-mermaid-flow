name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Validate manifest and versions
      run: npm run validate

    - name: Obsidian security and lint checks
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: Production build
      run: npm run build

    - name: Verify build assets
      run: |
        test -f main.js || (echo "❌ main.js missing" && exit 1)
        test -f manifest.json || (echo "❌ manifest.json missing" && exit 1)
        test -f styles.css || (echo "❌ styles.css missing" && exit 1)
        echo "✅ All release assets successfully built and verified."
